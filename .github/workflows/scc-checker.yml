name: SCC Complexity Check

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  scc-check:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aziontech/scc_check@b4ed269162790790be3f52d051f0e172ef32b442 # main @ 2026-10-23, pins its own actions
