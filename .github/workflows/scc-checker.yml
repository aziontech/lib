name: SCC Complexity Check

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  scc-check:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: aziontech/scc_check@b4ed269162790790be3f52d051f0e172ef32b442 # main @ 2026-10-23, pins its own actions
